<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Vos conversations Web101 Fil Rouge">
    <title>Conversations - Web101 Fil Rouge</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/conversation.css">
    <script src="js/conversation.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <a class="logo" href="conversation.html">Web101 Fil Rouge</a>
            <nav aria-label="Navigation principale">
                <a href="contact.html">Contacts</a>
                <a href="parametre.html">Paramètres</a>
            </nav>
        </div>
    </header>

    <main class="container conversation-layout" data-conversation-page>
        <aside class="conversation-sidebar" aria-label="Conversations">
            <div class="section-heading">
                <h1>Conversations</h1>
                <button class="button button-small button-primary" type="button" data-action="new-conversation">Nouvelle conversation</button>
            </div>
            <ul class="conversation-list" id="conversation-list" aria-live="polite"></ul>
        </aside>

        <section class="chat-panel" aria-labelledby="conversation-title" data-chat-panel>
            <ol class="message-list" id="message-list" aria-live="polite"></ol>

            <form class="message-form" id="message-form">
                <label class="sr-only" for="message-content">Contenu du message</label>
                <input type="text" id="message-content" name="message" placeholder="Écrire un message..." autocomplete="off" required data-message-input>
                <button class="button button-primary" type="submit">Envoyer</button>
            </form>
        </section>
    </main>
</body>
</html>
